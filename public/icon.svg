<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d"/>
      <stop offset="100%" stop-color="#0b0b0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- TV Antenna and Screen Accent -->
  <path d="M216 110 L256 148 L296 110" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  <circle cx="256" cy="150" r="6" fill="#FDE047"/>

  <!-- Monitor Frame with inner glow -->
  <rect x="76" y="160" width="360" height="240" rx="32" fill="#181824" stroke="url(#gold)" stroke-width="6"/>

  <!-- Monitor Stand -->
  <path d="M226 400 L216 438 L296 438 L286 400 Z" fill="#222230" stroke="#333346" stroke-width="2"/>
  <rect x="180" y="438" width="152" height="12" rx="6" fill="url(#gold)"/>

  <!-- Live TV indicator pill -->
  <rect x="330" y="180" width="80" height="26" rx="13" fill="url(#flame)"/>
  <circle cx="346" cy="193" r="5" fill="#FFFFFF"/>
  <text x="360" y="200" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" letter-spacing="1">LIVE</text>

  <!-- M2A Brand Text -->
  <g filter="url(#glow)">
    <text x="256" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, sans-serif" font-weight="900" font-size="94" letter-spacing="3" fill="url(#gold)">M2A</text>
  </g>

  <!-- Subtitle Tagline inside screen -->
  <text x="256" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" letter-spacing="4" fill="#94A3B8">TV · APPS · GAMES</text>
</svg>
