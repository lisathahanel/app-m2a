name: Validate Cloudflare Worker

on:
  pull_request:
    branches:
      - main
    paths:
      - "worker.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "index.html"
      - ".github/workflows/cloudflare-worker.yml"
  push:
    branches:
      - cloudflare-api-proxy-test

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run
